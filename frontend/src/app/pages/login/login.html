<div class="bg">
  <div class="card">

    <h1>🧋 Bubble Tea Login</h1>
    <p class="subtitle">Bienvenido de nuevo</p>

    <form [formGroup]="credentials" (ngSubmit)="login()">
      
      <input type="email" placeholder="Gmail" formControlName="email" />
      <input type="password" placeholder="Contraseña" formControlName="password" />

      <button type="submit" [disabled]="credentials.invalid">
        Entrar
      </button>
      
    </form>

    <p class="footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>

  </div>
</div>
