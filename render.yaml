version: "1"
projects:
- name: BubbleTea
  environments:
  - name: Production
    services:
    - type: web
      name: BubbleTea.-a
      runtime: python
      repo: https://github.com/mariamberuashvili/BubbleTea.-a
      plan: free
      envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      region: ohio
      buildCommand: pip install -r requirements.txt
      startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
      autoDeployTrigger: commit
      rootDir: backend
